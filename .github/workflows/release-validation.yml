name: Release validation

on:
  push:
    branches:
      - agent/release-v1.0.0

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Run tests
        run: python -m pytest -q

      - name: Run Ruff lint
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

      - name: Run mypy
        run: python -m mypy playlist_builder

      - name: Build distributions
        run: python -m build

      - name: Report validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$RESULT" = "success" ]; then
            MESSAGE="Release validation passed for \`$SHA\`: pytest, Ruff lint, Ruff format, mypy and package build are all green. Workflow run: $RUN_ID."
          else
            MESSAGE="Release validation failed for \`$SHA\`. Workflow run: $RUN_ID. Inspect the failed job before merging."
          fi
          gh pr comment 16 --body "$MESSAGE"
