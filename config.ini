# Configuración local de Playlist Builder. No guarde contraseñas ni tokens aquí.
# Las rutas relativas se interpretan desde la carpeta que contiene este archivo.
[playlist_builder]
music_root = /ruta/a/MiDiscoteca
default_year_margin = 5
default_size_mb = 8000
default_max_album = 2
# Días antes de reintentar metadatos fallidos; 0 reintenta en cada ejecución.
retry_error_after_days = 7
# 0 desactiva la cuota por artista de pista.
default_max_artist = 0
# Deduplicar por contenido requiere activación explícita; solo entonces calcula SHA-256.
deduplicate = false
cache_filename = .playlist_catalog.json
min_reasonable_year = 1000
# Años futuros que se aceptan al leer etiquetas (0 permite solo hasta el año actual).
max_reasonable_year_offset = 1
# Formatos con soporte validado de lectura de metadatos.
audio_extensions = .mp3, .flac, .m4a, .mp4, .ogg, .opus, .ape
# Oculta la composición durante el flujo y los mensajes normales.
surprise_mode = false
# Entradas de cada extremo que muestra la preview abreviada.
preview_entries = 5
# flat usa «índice - título (artista)»; tree conserva las carpetas originales.
copy_structure = flat
# Ruta absoluta o relativa a esta carpeta; no depende del directorio de ejecución.
profiles_file = filter_profiles.json
