# Configuración local de Playlist Builder. No guarde contraseñas ni tokens aquí.
# Las rutas relativas se interpretan desde la carpeta que contiene este archivo.
[playlist_builder]
# Carpeta raíz de la discoteca. Puede ser una ruta absoluta o relativa a este archivo.
music_root = /ruta/a/MiDiscoteca
# Si se introduce un único año Y, se filtra desde Y - margen hasta Y + margen.
default_year_margin = 5
# Tamaño máximo predeterminado de la playlist, en MB decimales.
default_size_mb = 8000
# Máximo predeterminado de canciones procedentes de una misma carpeta de álbum.
default_max_album = 2
# Si la lectura de metadatos de un archivo falla y el archivo no cambia, se reintenta
# después de estos días. 0 reintenta en cada ejecución; --rescan o un cambio de
# tamaño/fecha de modificación fuerzan el reintento inmediatamente.
retry_error_after_days = 7
# Máximo predeterminado por artista de pista. 0 desactiva esta cuota.
default_max_artist = 0
# Elimina candidatas idénticas por contenido. Solo calcula SHA-256 entre archivos
# del mismo tamaño y nunca modifica, elimina ni renombra los originales.
deduplicate = false
# Nombre del catálogo de caché guardado dentro de music_root. Debe ser un nombre,
# no una ruta. La caché evita releer metadatos de archivos que no han cambiado.
cache_filename = .playlist_catalog.json
# Año mínimo aceptado en etiquetas y filtros. Los valores inferiores se consideran
# datos erróneos; 1000 es un límite de validación, no una fecha de grabación.
min_reasonable_year = 1000
# Cuántos años posteriores al actual se aceptan en etiquetas y filtros. 1 permite
# lanzamientos fechados para el año siguiente; 0 acepta como máximo el año actual.
max_reasonable_year_offset = 1
# Evita revelar qué canciones fueron seleccionadas antes de crear la playlist:
# omite los recuentos iniciales, la preview y los conteos de candidatas y resultado.
# Los filtros y límites siguen visibles. Con copia, los nombres no incluyen título
# ni artista. Abrir el M3U final sí revela su contenido.
surprise_mode = false
# Canciones de cada extremo mostradas en la preview abreviada. 5 significa las
# primeras 5 y las últimas 5; si la selección tiene 10 o menos, se muestran todas.
preview_entries = 5

# Alias opcionales de género. Descomente y adapte el bloque para activarlos.
# [genre_aliases]
# Jazz = jazz fusion; jazz/fusion; fusion
# Electrónica = electronic; electronica; electrónica
