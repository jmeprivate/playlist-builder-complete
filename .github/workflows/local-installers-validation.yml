name: Local installers validation

on:
  push:
    branches:
      - agent/local-installers
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  posix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate POSIX installer
        shell: bash
        run: |
          sh -n install.sh
          sh -n crear-playlist.sh
          mkdir -p "$RUNNER_TEMP/music"
          sh install.sh "$RUNNER_TEMP/music"
          test -x .venv/bin/python
          grep -F "music_root = $RUNNER_TEMP/music" config.ini
          ./crear-playlist.sh --help >/dev/null
          PLAYLIST_BUILDER_MUSIC_ROOT="$RUNNER_TEMP/music" sh install.sh

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate PowerShell 5.1 installer
        shell: powershell
        run: |
          $music = Join-Path $env:RUNNER_TEMP 'music'
          New-Item -ItemType Directory -Path $music -Force | Out-Null
          .\install.ps1 -MusicRoot $music
          if (-not (Test-Path .\.venv\Scripts\python.exe)) { throw 'No se creo .venv' }
          $expected = 'music_root = ' + (Resolve-Path $music).Path
          if (-not (Select-String -Path .\config.ini -SimpleMatch $expected)) { throw 'music_root no se configuro' }
          .\crear-playlist.cmd --help | Out-Null
          .\install.ps1 -SkipConfig

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy playlist_builder
